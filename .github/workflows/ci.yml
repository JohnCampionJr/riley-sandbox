name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, synchronize]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ci')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: ./run-tests.sh
